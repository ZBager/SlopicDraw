apply plugin: "kotlin"

sourceCompatibility = 1.6
sourceSets.main.java.srcDirs = [ "src/" ]

project.ext.mainClassName = "me.wieku.circuits.desktop.DesktopLauncherKt"
project.ext.assetsDir = new File("../android/assets")

task run(dependsOn: classes, type: JavaExec) {
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
}

task debug(dependsOn: classes, type: JavaExec) {
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
}

task dist(type: Jar) {
    baseName = "LogicDraw"
    from files(sourceSets.main.output.classesDir)
    from files(sourceSets.main.output.resourcesDir)
    from {configurations.compile.collect {zipTree(it)}}
    from files(project.assetsDir);
 
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
}

dist.dependsOn classes

eclipse {
    project {
        name = appName + "-desktop"
        linkedResource name: 'assets', type: '2', location: 'PARENT-1-PROJECT_LOC/android/assets'
    }
}

task afterEclipseImport(description: "Post processing after project generation", group: "IDE") {
  doLast {
    def classpath = new XmlParser().parse(file(".classpath"))
    new Node(classpath, "classpathentry", [ kind: 'src', path: 'assets' ]);
    def writer = new FileWriter(file(".classpath"))
    def printer = new XmlNodePrinter(new PrintWriter(writer))
    printer.setPreserveWhitespace(true)
    printer.print(classpath)
  }
}

sourceSets.test.java.srcDirs = ["test"]

def terniProperties = System.properties.findAll { key, value ->
    key == "logicdraw.backend" || key.startsWith("logicdraw.terni.")
}
[run, debug].each { it.systemProperties terniProperties }

task terniCheck(type: JavaExec, dependsOn: testClasses) {
    main = "me.wieku.circuits.desktop.simulation.TerniHarnessKt"
    classpath = sourceSets.test.runtimeClasspath
    systemProperties terniProperties
    args rootProject.file("android/assets/maps/test.ldmap").absolutePath
}

task terniBenchmark(type: JavaExec, dependsOn: testClasses) {
    main = terniCheck.main
    classpath = sourceSets.test.runtimeClasspath
    systemProperties terniProperties
    args "benchmark", (project.findProperty("sizes") ?: "1000,10000,100000,1000000"),
         (project.findProperty("ticks") ?: "100")
}

task terniRenderBenchmark(type: JavaExec, dependsOn: testClasses) {
    main = terniCheck.main
    classpath = sourceSets.test.runtimeClasspath
    workingDir = project.assetsDir
    systemProperties terniProperties
    args "render", (project.findProperty("size") ?: "100000"),
         (project.findProperty("backend") ?: "classic"), (project.findProperty("seconds") ?: "5")
}

task terniNative {
    group = "build"
    description = "Build the optional Terni JNI library with CMake"
    doLast {
        def out = rootProject.file("build/terni")
        def configure = ["cmake", "-S", file("native").absolutePath, "-B", out.absolutePath,
                         "-DCMAKE_BUILD_TYPE=Release"]
        if (project.hasProperty("terniSource")) {
            configure += "-DFETCHCONTENT_SOURCE_DIR_TERNI=" + rootProject.file(terniSource).absolutePath
        }
        exec { commandLine configure }
        exec { commandLine "cmake", "--build", out.absolutePath, "--config", "Release" }
    }
}
