name: Desktop CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build downloadable ZIPs without publishing a release
        type: boolean
        default: false
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }} x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            library: build/terni/liblogicdraw_terni.so
          - platform: windows
            runner: windows-2022
            library: build/terni/Release/logicdraw_terni.dll
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Linux Vulkan tools and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc mesa-vulkan-drivers
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${icds[0]}"
          echo "VK_DRIVER_FILES=${icds[0]}" >> "$GITHUB_ENV"

      - name: Install Windows Vulkan SDK and lavapipe
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.363.1'
          install_runtime: true
          install_lavapipe: true
          cache: true
          github_token: ${{ github.token }}

      - name: Build JNI bridge and distribution, then compare Classic and Terni
        if: runner.os == 'Linux'
        run: |
          cmake -S desktop/native -B build/terni -DCMAKE_BUILD_TYPE=Release
          cmake --build build/terni --parallel
          ./gradlew --no-daemon -PdesktopOnly :desktop:dist :desktop:terniCheck \
            -Dlogicdraw.terni.software=true "-Dlogicdraw.terni.library=$PWD/${{ matrix.library }}"

      - name: Build JNI bridge and distribution, then compare Classic and Terni
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:VULKAN_SDK\Bin;$env:VULKAN_SDK\runtime\x64;$env:PATH"
          cmake -S desktop/native -B build/terni -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/terni --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $library = (Resolve-Path '${{ matrix.library }}').Path
          .\gradlew.bat --no-daemon -PdesktopOnly :desktop:dist :desktop:terniCheck '-Dlogicdraw.terni.software=true' "-Dlogicdraw.terni.library=$library"
          exit $LASTEXITCODE

      - name: Assemble release archive
        if: inputs.package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          LIBRARY: ${{ matrix.library }}
        run: |
          mkdir -p package/native
          jars=(desktop/build/libs/LogicDraw-*.jar)
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" package/SlopicDraw.jar
          cp "$LIBRARY" package/native/
          cp LICENSE package/LogicDraw-LICENSE.txt
          cp build/terni/_deps/terni-src/LICENSE package/native/Terni-LICENSE.txt
          cp build/terni/_deps/terni-src/LICENSE-EXCEPTION package/native/Terni-LICENSE-EXCEPTION.txt
          cp docs/terni.md package/TERNI.md
          cat > package/README.txt <<'INSTRUCTIONS'
          Run Classic using java -jar SlopicDraw.jar (Java 8).
          See TERNI.md for Vulkan requirements and backend configuration.
          The JNI library for this platform is in native/.
          Example after extracting the archive and opening a terminal in this directory:
            java -Dlogicdraw.backend=terni -Djava.library.path=native -jar SlopicDraw.jar
          INSTRUCTIONS
          cmake -E chdir package cmake -E tar cf "../SlopicDraw-$PLATFORM-x64.zip" --format=zip -- .

      - uses: actions/upload-artifact@v7.0.2
        if: inputs.package
        with:
          name: SlopicDraw-${{ matrix.platform }}-x64
          path: SlopicDraw-${{ matrix.platform }}-x64.zip
          if-no-files-found: error
